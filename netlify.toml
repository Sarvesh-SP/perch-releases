# Static site: no build step, publish this folder as-is.
[build]
  publish = "."

# Sparkle reads this feed; never let a CDN or browser serve a stale copy.
[[headers]]
  for = "/appcast.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# Latest DMG keeps a fixed name, so revalidate it every time.
[[headers]]
  for = "/Perch.dmg"
  [headers.values]
    Content-Type = "application/x-apple-diskimage"
    Cache-Control = "public, max-age=0, must-revalidate"

# Versioned DMGs never change once published.
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Type = "application/x-apple-diskimage"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
